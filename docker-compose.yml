# Satu server berisi: website+API (app), database, 9router, dan Caddy untuk HTTPS.
# Jalankan: docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://toko:${POSTGRES_PASSWORD}@db:5432/toko
      ROUTER_BASE_URL: ${ROUTER_BASE_URL:-http://9router:20128/v1}
    depends_on:
      db:
        condition: service_healthy
      9router:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: toko
      POSTGRES_DB: toko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toko -d toko"]
      interval: 5s
      retries: 10

  9router:
    image: decolua/9router:latest
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      REQUIRE_API_KEY: "true"
      INITIAL_PASSWORD: ${ROUTER_DASHBOARD_PASSWORD:?isi ROUTER_DASHBOARD_PASSWORD di .env}
    volumes:
      - router-data:/app/data
    # Dashboard 9router HANYA bisa diakses dari server itu sendiri.
    # Dari laptop: ssh -L 20128:127.0.0.1:20128 user@server  lalu buka http://localhost:20128/dashboard
    ports:
      - "127.0.0.1:20128:20128"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?isi DOMAIN di .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  router-data:
  caddy-data:
  caddy-config:
