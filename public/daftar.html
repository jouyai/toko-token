<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daftar — Toko Token</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="app-body" data-page="register">
  <header class="nav wrap">
    <a href="/" class="logo"><span class="logo__bolt">⚡</span>TOKO<b>TOKEN</b></a>
    <a href="/" class="nav__login">← Kembali</a>
  </header>
  <main class="app-main wrap">
    <section class="auth">
      <div class="auth__side">
        <p class="eyebrow">Akun baru</p>
        <h1>Satu akun,<br /><em>semua model.</em></h1>
        <p class="lead">Daftar gratis. Kamu cuma bayar token yang kamu isi, nggak ada biaya bulanan.</p>
      </div>
      <div class="card">
        <h2>Buat akun</h2>
        <form class="form" id="form" novalidate>
          <label class="field"><span>Nama</span><input name="name" autocomplete="name" required maxlength="80" /></label>
          <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required /></label>
          <label class="field"><span>Password (min. 8 karakter)</span><input name="password" type="password" autocomplete="new-password" minlength="8" required /></label>
          <label class="check"><input type="checkbox" name="agree" value="1" required /><span>Saya setuju dengan <a href="/syarat" target="_blank">Syarat &amp; Ketentuan</a> dan <a href="/privasi" target="_blank">Kebijakan Privasi</a>.</span></label>
          <p class="form-error" role="alert"></p>
          <button class="btn btn--signal btn--block" type="submit">Daftar ↵</button>
        </form>
        <p class="form-foot">Sudah punya akun? <a href="/masuk" id="toLogin">Masuk</a></p>
      </div>
    </section>
  </main>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
